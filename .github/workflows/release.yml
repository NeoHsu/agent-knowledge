# This workflow is based on cargo-dist's generated GitHub release pipeline.
# `dist generate` does not preserve the SHA pins, dependency policy, native
# verification, installer checksum hardening, or SBOM verification below;
# after regeneration, reapply those controls and run actionlint.
name: Release

on:
  pull_request:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Verify exact CLI, skill, and release-tag version lockstep
        env:
          RELEASE_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          tag_args=()
          [[ -z "$RELEASE_TAG" ]] || tag_args+=(--tag "$RELEASE_TAG")
          python3 scripts/check-skill-version.py "${tag_args[@]}"

      - name: Install dist
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-dist@0.31.0

      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        shell: bash
        env:
          RELEASE_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            dist host --steps=create "--tag=$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  verify:
    name: verify release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install Python 3.12
        if: runner.os == 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify release metadata, tag, and clean checkout
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: python3 scripts/check-release-metadata.py --release-tag "$RELEASE_TAG"

      - name: Verify exact CLI and skill version lockstep
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          tag_args=()
          [[ -z "$RELEASE_TAG" ]] || tag_args+=(--tag "$RELEASE_TAG")
          python3 scripts/check-skill-version.py "${tag_args[@]}"

      - name: Reject runtime artifacts in the source checkout
        if: runner.os == 'Linux'
        run: python3 scripts/check-source-hygiene.py

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Install verified gitleaks
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$HOME/.cargo/bin/gitleaks"

      - name: Scan Git history and current source tree for secrets
        if: runner.os == 'Linux'
        run: python3 scripts/check-secrets.py

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        if: runner.os == 'Linux'
        with:
          version: "0.16.1"
          checksum: "7e1cc9b3da4911bb2c98c076302fd8997d822fac74dd8f1e30371701e70a4c56"
          args: "check scripts"

      - name: Check Python formatting
        if: runner.os == 'Linux'
        run: ruff format --check scripts

      - name: Install cargo-machete
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-machete@0.9.2

      - name: Check for unused Cargo dependencies
        if: runner.os == 'Linux'
        run: cargo machete

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.1

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny@0.20.2

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: cargo audit --deny warnings

      - name: Enforce dependency license, source, and ban policy
        if: runner.os == 'Linux'
        run: cargo deny check

      - name: Enforce dependency provenance and license metadata
        if: runner.os == 'Linux'
        run: python3 scripts/check-dependency-policy.py

      - name: Test release helper scripts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build release binary
        shell: bash
        run: scripts/build-release.sh

      - name: Enforce release binary size budget
        run: python3 scripts/check-binary-size.py

      - name: Evaluate retrieval quality
        shell: bash
        run: >-
          python3 scripts/evaluate-retrieval.py
          --report "${{ runner.temp }}/retrieval-eval.json"

      - name: Retain retrieval evaluation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/retrieval-eval.json
          if-no-files-found: warn
          retention-days: 90

      - name: Smoke-test installed release binary and recovery drill
        shell: bash
        run: scripts/smoke-release.sh

      - name: Benchmark release candidate
        if: runner.os == 'Linux'
        shell: bash
        env:
          SCALES: "100 1000"
          INTERACTIVE_RUNS: "2"
          MAINTENANCE_RUNS: "1"
          WARMUP_RUNS: "0"
          REPORT_FILE: ${{ runner.temp }}/release-benchmark-report.json
        run: scripts/benchmark-scale.sh | tee "$RUNNER_TEMP/release-benchmark.csv"

      - name: Enforce release benchmark guardrails
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/check-benchmark-regression.py
          --report "$RUNNER_TEMP/release-benchmark-report.json"
          --guardrails scripts/benchmark-guardrails.json
          --require-clean

      - name: Retain release benchmark evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-benchmark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-benchmark-report.json
            ${{ runner.temp }}/release-benchmark.csv
          if-no-files-found: warn
          retention-days: 90

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    timeout-minutes: 90
    needs:
      - plan
      - verify
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      MATRIX_DIST_ARGS: ${{ matrix.dist_args }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Install dist
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-dist@0.31.0

      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Build artifacts
        shell: bash
        run: |
          tag_args=()
          dist_args=()
          if [[ -n "$DIST_TAG_FLAG" ]]; then
            tag_args+=("$DIST_TAG_FLAG")
          fi
          if [[ -n "$MATRIX_DIST_ARGS" ]]; then
            read -r -a dist_args <<< "$MATRIX_DIST_ARGS"
          fi
          dist build "${tag_args[@]}" --print=linkage --output-format=json "${dist_args[@]}" > dist-manifest.json

      - name: Verify pinned CJK dictionary source
        run: python3 scripts/check-cjk-dictionary.py --target-dir target

      - name: Attest build provenance
        if: needs.plan.outputs.publishing == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  verify-platform-artifacts:
    name: verify-platform-artifacts (${{ matrix.name }})
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') && needs.build-local-artifacts.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-14
          - name: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Fetch local platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Verify and execute host-compatible archive
        run: python scripts/verify-release-artifacts.py --platform-only --execute-native

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Install verified cargo-cyclonedx
        shell: bash
        run: |
          installer="$RUNNER_TEMP/cargo-cyclonedx-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$installer" \
            https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-installer.sh
          printf '%s  %s\n' '051086226aec893866f20e60b19265f7ca5f488a2e282c6be748ee663ab0a124' "$installer" \
            | sha256sum --check --strict
          sh "$installer"

      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        run: |
          tag_args=()
          if [[ -n "$DIST_TAG_FLAG" ]]; then
            tag_args+=("$DIST_TAG_FLAG")
          fi
          dist build "${tag_args[@]}" --output-format=json "--artifacts=global" > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Make generated installers fail closed on archive checksums
        run: python3 scripts/harden-installers.py

      - id: supply-chain
        name: Generate and verify SBOM and installer checksums
        shell: bash
        run: |
          cargo cyclonedx --manifest-path crates/mem-cli/Cargo.toml --format xml \
            --spec-version 1.5 --describe binaries -v
          mv crates/mem-cli/mem_bin.cdx.xml target/distrib/mnemark.cdx.xml
          test -s target/distrib/mnemark.cdx.xml
          grep -q '<hash alg="SHA-256">' target/distrib/mnemark.cdx.xml
          (
            cd target/distrib
            sha256sum mnemark.cdx.xml > mnemark.cdx.xml.sha256
            sha256sum mnemark-installer.sh > mnemark-installer.sh.sha256
            sha256sum mnemark-installer.ps1 > mnemark-installer.ps1.sha256
            cat mnemark.cdx.xml.sha256 mnemark-installer.sh.sha256 \
              mnemark-installer.ps1.sha256 >> sha256.sum
          )
          python3 scripts/verify-release-artifacts.py --execute-native
          {
            echo "paths<<EOF"
            echo "target/distrib/mnemark.cdx.xml"
            echo "target/distrib/mnemark.cdx.xml.sha256"
            echo "target/distrib/mnemark-installer.sh.sha256"
            echo "target/distrib/mnemark-installer.ps1.sha256"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest global artifacts
        if: needs.plan.outputs.publishing == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "target/distrib/*"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.supply-chain.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    needs:
      - plan
      - verify
      - build-local-artifacts
      - build-global-artifacts
      - verify-platform-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.verify.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.verify-platform-artifacts.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        run: |
          tag_args=()
          if [[ -n "$DIST_TAG_FLAG" ]]; then
            tag_args+=("$DIST_TAG_FLAG")
          fi
          dist host "${tag_args[@]}" --steps=upload --steps=release --output-format=json > dist-manifest.json
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Cleanup manifests
        run: rm -f artifacts/*-dist-manifest.json

      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          release_args=()
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            release_args+=("$PRERELEASE_FLAG")
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" "${release_args[@]}" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    timeout-minutes: 15
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Announce release
        shell: bash
        run: |
          tag_args=()
          if [[ -n "$DIST_TAG_FLAG" ]]; then
            tag_args+=("$DIST_TAG_FLAG")
          fi
          dist host "${tag_args[@]}" --steps=announce --output-format=json
