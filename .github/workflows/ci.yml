name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.97.0"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - if: matrix.rust == 'stable'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - if: matrix.rust == 'stable'
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit
      - if: matrix.rust == 'stable'
        run: cargo audit --deny warnings
      - if: matrix.rust == 'stable'
        run: python3 scripts/check-dependency-policy.py
      - if: matrix.rust == 'stable'
        run: scripts/build-release.sh
      - if: matrix.rust == 'stable'
        run: ls -lh target/release/mem
      - if: matrix.rust == 'stable'
        run: scripts/smoke-release.sh
      - name: Benchmark correctness smoke
        if: matrix.rust == 'stable'
        env:
          SCALES: "100 1000"
          INTERACTIVE_RUNS: "2"
          MAINTENANCE_RUNS: "1"
          WARMUP_RUNS: "0"
          REPORT_FILE: ${{ runner.temp }}/benchmark-report.json
        run: scripts/benchmark-scale.sh | tee "$RUNNER_TEMP/benchmark.csv"
