name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        # Pull requests already run Rust 1.97.1 on Linux, macOS, and Windows in
        # release.yml. Keep direct main pushes independently covered here.
        rust: ${{ fromJSON(github.event_name == 'pull_request' && '["stable"]' || '["stable","1.97.1"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Verify release metadata and clean checkout
        if: matrix.rust == 'stable'
        run: python3 scripts/check-release-metadata.py
      - name: Verify exact CLI and skill version lockstep
        if: matrix.rust == 'stable'
        run: python3 scripts/check-skill-version.py
      - name: Reject runtime artifacts in the source checkout
        if: matrix.rust == 'stable'
        run: python3 scripts/check-source-hygiene.py
      - if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - if: matrix.rust == 'stable'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Install verified gitleaks
        if: matrix.rust == 'stable'
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$HOME/.cargo/bin/gitleaks"
      - name: Scan Git history and current source tree for secrets
        if: matrix.rust == 'stable'
        run: python3 scripts/check-secrets.py
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        if: matrix.rust == 'stable'
        with:
          version: "0.16.1"
          checksum: "7e1cc9b3da4911bb2c98c076302fd8997d822fac74dd8f1e30371701e70a4c56"
          args: "check scripts"
      - name: Check Python formatting
        if: matrix.rust == 'stable'
        run: ruff format --check scripts
      - if: matrix.rust == 'stable'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest@0.9.4
      - if: matrix.rust == 'stable'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-machete@0.9.2
      - if: matrix.rust == 'stable'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.1
      - if: matrix.rust == 'stable'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny@0.20.2
      - if: matrix.rust == 'stable'
        run: cargo machete
      - if: matrix.rust == 'stable'
        run: cargo nextest run --workspace --locked --status-level all
      - if: matrix.rust == 'stable'
        run: cargo test --doc --workspace --locked
      - if: matrix.rust != 'stable'
        run: cargo test --workspace --locked
      - if: matrix.rust == 'stable'
        run: cargo audit --deny warnings
      - if: matrix.rust == 'stable'
        run: cargo deny check
      - if: matrix.rust == 'stable'
        run: python3 scripts/check-dependency-policy.py
      - name: Test release helper scripts
        if: matrix.rust == 'stable'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - if: matrix.rust == 'stable'
        run: scripts/build-release.sh
      - name: Enforce release binary size budget
        if: matrix.rust == 'stable'
        run: python3 scripts/check-binary-size.py
      - name: Evaluate retrieval quality
        if: matrix.rust == 'stable'
        run: >-
          python3 scripts/evaluate-retrieval.py
          --report "$RUNNER_TEMP/retrieval-eval.json"
      - name: Retain retrieval evaluation
        if: matrix.rust == 'stable' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval-${{ github.sha }}
          path: ${{ runner.temp }}/retrieval-eval.json
          if-no-files-found: warn
          retention-days: 30
      - if: matrix.rust == 'stable'
        run: ls -lh target/release/mem
      - if: matrix.rust == 'stable'
        run: scripts/smoke-release.sh
      - name: Benchmark correctness smoke
        if: matrix.rust == 'stable'
        env:
          SCALES: "100 1000"
          INTERACTIVE_RUNS: "2"
          MAINTENANCE_RUNS: "1"
          WARMUP_RUNS: "0"
          REPORT_FILE: ${{ runner.temp }}/benchmark-report.json
        run: scripts/benchmark-scale.sh | tee "$RUNNER_TEMP/benchmark.csv"
      - name: Enforce benchmark guardrails
        if: matrix.rust == 'stable'
        run: >-
          python3 scripts/check-benchmark-regression.py
          --report "$RUNNER_TEMP/benchmark-report.json"
          --guardrails scripts/benchmark-guardrails.json
          --require-clean
      - name: Retain benchmark evidence
        if: matrix.rust == 'stable' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/benchmark-report.json
            ${{ runner.temp }}/benchmark.csv
          if-no-files-found: warn
          retention-days: 30

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate workflow contracts
        run: scripts/check-workflows.sh
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          persona: pedantic
          min-severity: medium
          min-confidence: medium
          advanced-security: false
          annotations: true

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov@0.8.7
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only --fail-under-lines 86
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
