[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
python = "3.12.13"
ruff = "0.16.1"
sccache = "0.17.0"
zizmor = "1.29.0"
zig = "0.16.0"
"cargo:cargo-audit" = "0.22.1"
"cargo:cargo-bloat" = "0.12.1"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-nextest" = "0.9.4"

[tools.rust]
version = "1.97.1"
profile = "default"
components = ["rust-analyzer", "rust-src", "llvm-tools-preview"]

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.lint]
description = "Check Rust formatting and run the CI Clippy policy"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --locked --all-targets -- -D warnings",
]

[tasks.test]
description = "Run every workspace test"
run = "cargo test --workspace --locked"

[tasks."test:nextest"]
description = "Run workspace tests in parallel and retain doctest coverage"
run = [
  "cargo nextest run --workspace --locked --status-level all",
  "cargo test --doc --workspace --locked",
]

[tasks."deps:check"]
description = "Check workspace manifests for unused Cargo dependencies"
run = "cargo machete"

[tasks."deps:duplicates"]
description = "Report duplicate dependency versions without making them blocking"
run = "cargo tree -d --workspace --locked"

[tasks."size:bloat"]
description = "Report release binary size by crate without changing runtime optimization"
run = "cargo bloat --profile dist --bin mem --crates --locked -n 30"

[tasks."size:check"]
description = "Enforce the 50 MiB release binary budget"
run = "python3 scripts/check-binary-size.py"

[tasks.msrv]
description = "Check all targets with the minimum supported Rust toolchain"
run = "cargo +1.97.1 check --workspace --all-targets --locked"

[tasks."security:secrets"]
description = "Scan Git history and current non-ignored sources for secrets"
run = "python3 scripts/check-secrets.py"

[tasks.security]
description = "Run secret, dependency-policy, and RustSec checks"
run = [
  "python3 scripts/check-secrets.py",
  "cargo deny check",
  "cargo audit --deny warnings",
]

[tasks.deny]
description = "Check dependency licenses, sources, bans, and advisories"
run = "cargo deny check"

[tasks.audit]
description = "Audit Cargo.lock against the RustSec advisory database"
run = "cargo audit --deny warnings"

[tasks."python:lint"]
description = "Lint repository Python tooling with Ruff"
run = "ruff check scripts"

[tasks."python:format"]
description = "Check repository Python formatting with Ruff"
run = "ruff format --check scripts"

[tasks."python:complexity"]
description = "Report Python complexity candidates without blocking"
run = "ruff check scripts --select C901,PLR0911,PLR0912,PLR0913,PLR0915 --exit-zero"

[tasks."tooling:test"]
description = "Run repository Python tooling tests"
run = "python3 -m unittest discover -s scripts/tests -p 'test_*.py'"

[tasks."workflow:check"]
description = "Validate workflow syntax, immutable Action pins, and required gates"
run = "scripts/check-workflows.sh"

[tasks."workflow:security"]
description = "Audit GitHub Actions workflows with zizmor"
run = "zizmor --persona pedantic --min-severity medium --min-confidence medium ."

[tasks."sccache:stats"]
description = "Show current sccache statistics after opting in with RUSTC_WRAPPER=sccache"
run = "sccache --show-stats"

[tasks."check:fast"]
description = "Run formatting, Clippy, and the focused mnemark contract tests"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --locked --all-targets -- -D warnings",
  "cargo test -p mnemark --locked --test integration contract::",
  "cargo test -p mnemark --locked --test integration discovery_contract::",
  "cargo test -p mnemark --locked --test doc_drift",
]

[tasks."contract:check"]
description = "Check CLI surface, docs, schemas, operation effects, and skill lockstep"
run = [
  "python3 scripts/check-skill-version.py",
  "cargo test -p mnemark --locked --test integration contract::",
  "cargo test -p mnemark --locked --test integration discovery_contract::",
  "cargo test -p mnemark --locked --test doc_drift",
]

[tasks."contract:update"]
description = "Regenerate the checked-in public CLI surface snapshot"
env = { UPDATE_CLI_SURFACE = "1" }
run = "env -u CC -u CXX cargo test -p mnemark --locked --test doc_drift cli_surface_snapshot_matches_clap"

[tasks.coverage]
description = "Generate LCOV and enforce the measured 86 percent line-coverage floor"
run = [
  "env -u CC -u CXX cargo llvm-cov --workspace --lcov --output-path target/lcov.info",
  "env -u CC -u CXX cargo llvm-cov report --summary-only --fail-under-lines 86",
]

[tasks."check:pr"]
description = "Run deterministic checks required before opening a pull request"
run = [
  "git diff --check",
  "cargo machete",
  "python3 scripts/check-secrets.py",
  "python3 scripts/check-skill-version.py",
  "ruff check scripts",
  "ruff format --check scripts",
  "ruff check scripts --select C901,PLR0911,PLR0912,PLR0913,PLR0915 --exit-zero",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --locked --all-targets -- -D warnings",
  "cargo nextest run --workspace --locked --status-level all",
  "cargo test --doc --workspace --locked",
  "python3 -m unittest discover -s scripts/tests -p 'test_*.py'",
  "cargo +1.97.1 check --workspace --all-targets --locked",
  "cargo deny check",
  "cargo audit --deny warnings",
  "python3 scripts/check-dependency-policy.py",
  "python3 scripts/check-source-hygiene.py",
  "scripts/check-workflows.sh",
  "zizmor --persona pedantic --min-severity medium --min-confidence medium .",
]

[tasks."eval:retrieval"]
description = "Build the release binary and run deterministic retrieval-quality cases"
run = [
  "scripts/build-release.sh",
  "python3 scripts/evaluate-retrieval.py --report target/retrieval-eval.json",
]

[tasks."eval:agent-reference"]
description = "Validate the synthetic agent-trace example (not live-agent evidence)"
run = "python3 scripts/evaluate-agent-behavior.py --responses evals/agent-behavior-reference-v1.json --report target/agent-behavior-reference-report.json"

[tasks.production-check]
description = "Run the complete release-readiness gate"
run = "scripts/check-release-readiness.sh"

[tasks.recovery-drill]
description = "Verify bundle restore and local recovery invariants"
run = "scripts/recovery-drill.sh"
