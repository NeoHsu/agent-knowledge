schema_version: 1
goal: Describe the recurring task outcome.
triggers:
  - user asks for this recurring task
preconditions:
  - required repository or system context is available
reusable_scripts:
  - path: scripts/example.sh
    owner: repo
    required: true
    purpose: project-owned executable logic referenced by this workflow
  - path: artifacts/scripts/example-helper.sh
    owner: knowledge_store
    required: true
    checksum: sha256:<hex>
    purpose: cross-project helper owned by the active knowledge store
steps:
  - id: inspect
    check: confirm the current state and relevant inputs
    verify: the task scope and safety conditions are understood
  - id: scripted-step
    run: scripts/example.sh
    check: scripts/example.sh exists and is executable
    verify: the script completed as intended
  - id: artifact-assisted-step
    run: artifacts/scripts/example-helper.sh
    check: artifact exists under the active knowledge store, checksum matches manifest.toml, and script is executable
    verify: the helper produced the expected context
  - id: act
    manual: perform the smallest appropriate action
    verify: the action completed as intended
  - id: risky-step
    run: command that has external side effects
    confirm: true
    verify: external side effect completed as expected
stop_conditions:
  - required access is missing
  - unrelated dirty files or unsafe state exist
  - a verification step fails
outputs:
  - concise summary of actions taken
  - links, commits, or artifacts produced
post_run_memory:
  - save durable failures, lessons, or confirmed workflow changes
