# Minimal mnemark workflow runbook scaffold.
# Replace every <replace: ...> value, then set draft to false.
# Required fields: schema_version, goal, triggers, steps, stop_conditions.
# Each step needs `id` plus one of run / check / manual / ask.
# YAML trap: quote values beginning with reserved characters such as ` or @.
schema_version: 1
draft: true
goal: "<replace: recurring task outcome>"
triggers:
  - "<replace: task intent or user request>"
preconditions:
  - "<replace: condition that must pass before step 1>"
steps:
  - id: inspect
    check: "<replace: current state and relevant inputs to inspect>"
    verify: "<replace: evidence that scope and safety are understood>"
  - id: act
    check: "<replace: precondition for the action>"
    manual: "<replace: smallest appropriate action>"
    verify: "<replace: observable evidence that the action succeeded>"
stop_conditions:
  - "<replace: condition requiring an immediate stop>"
outputs:
  - "<replace: observable deliverable or completion criterion>"
post_run_memory:
  - save durable failures, lessons, or confirmed workflow changes
