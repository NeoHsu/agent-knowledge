# User config: ~/.config/mnemark/config.toml
# Store config: $MNEMARK_HOME/config.toml

# User config only: choose the active runtime store when MNEMARK_HOME is unset.
knowledge_home = "~/.mnemark"

# Defaults for query and workflow commands. CLI flags override these values.
default_scope = "auto"
default_limit = 20

[query]
default_scope = "auto"
default_limit = 20

[workflow]
default_scope = "auto"
default_limit = 20

# Soft cap on active memories per scope (default 30, 0 disables). Writes are
# never blocked; `mem audit` and retros flag over-budget scopes for curation.
[budget]
per_scope_max = 30
