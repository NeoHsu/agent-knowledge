# Keep native macOS builds on the platform toolchain when a parent shell leaks
# malformed generic compiler variables such as CC="zig cc". These names resolve
# through PATH; explicit target-specific environment variables still win.
[env]
CC_aarch64_apple_darwin = "cc"
CXX_aarch64_apple_darwin = "c++"
AR_aarch64_apple_darwin = "ar"
CC_x86_64_apple_darwin = "cc"
CXX_x86_64_apple_darwin = "c++"
AR_x86_64_apple_darwin = "ar"
