[package]
name = "agent-knowledge"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NeoHsu/agent-knowledge"
homepage = "https://github.com/NeoHsu/agent-knowledge"
rust-version = "1.85"

[[bin]]
name = "mem"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
lindera = { version = "2.0.1", features = ["embed-cc-cedict"] }
lindera-tantivy = { version = "2.0.0", features = ["embed-cc-cedict"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tantivy = "0.25"
uuid = { version = "1.11", features = ["v4"] }

[profile.dist]
inherits = "release"
lto = "thin"
