[workspace]
members = ["crates/mem-core", "crates/mem-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NeoHsu/mnemark"
homepage = "https://github.com/NeoHsu/mnemark"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
lindera = { version = "2.0.1", default-features = false }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml_ng is the actively maintained fork of the unmaintained serde_yaml crate.
# We alias it as `serde_yaml` so code using `serde_yaml::` imports works without changes.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tantivy = "0.26.1"
toml = "0.9.12"
uuid = { version = "1.11", features = ["v4"] }

[profile.dist]
inherits = "release"
lto = "thin"
