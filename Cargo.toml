[workspace]
members = ["crates/mem-core", "crates/mem-cli"]
resolver = "3"

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/NeoHsu/mnemark"
homepage = "https://github.com/NeoHsu/mnemark"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
fs2 = "0.4.3"
lindera = { version = "5.3.0", default-features = false }
regex = "1.12.3"
rusqlite = { version = "0.40.0", features = ["bundled", "chrono", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# serde_yaml_ng is the actively maintained fork of the unmaintained serde_yaml crate.
# We alias it as `serde_yaml` so code using `serde_yaml::` imports works without changes.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tantivy = "0.26.1"
tempfile = "3.27.0"
toml = "1.1.2"
uuid = { version = "1.23.2", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
